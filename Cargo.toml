[package]
name = "synt-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/syntso/mcp"
publish = false

[dependencies]
rmcp = { version = "3.6.0", default-features = false, features = ["server", "transport-io"] }
serde_json = "1.0.154"
synt-client = { git = "https://github.com/syntso/protocol", tag = "v0.2.0" }
synt-proto = { git = "https://github.com/syntso/protocol", tag = "v0.2.0" }
synt-transport = { git = "https://github.com/syntso/protocol", tag = "v0.2.0" }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
